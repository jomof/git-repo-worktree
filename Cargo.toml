[package]
name = "git-repo-worktree"
version = "2.1.1"
edition = "2021"
rust-version = "1.75"
description = "Whole-tree linked worktrees for Google repo clients"
license = "Apache-2.0"
repository = "https://github.com/jomof/git-repo-worktree"
readme = "README.md"
include = ["/src/**/*.rs", "/build.rs", "/skill/SKILL.md", "/README.md", "/LICENSE"]
keywords = ["git", "repo", "worktree", "android", "aosp"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "git-repo-worktree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "=4.5.23", features = ["derive"] }
clap_complete = "=4.5.40"
fd-lock = "4"
indexmap = "=2.7.1"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
reflink-copy = "=0.1.29"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
time = { version = "=0.3.36", features = ["formatting", "macros"] }
ctrlc = { version = "3", features = ["termination"] }

[build-dependencies]
clap = { version = "=4.5.23", features = ["derive"] }
clap_mangen = "=0.2.26"

[dev-dependencies]
assert_cmd = "=2.0.16"
predicates = "=3.1.2"
tempfile = "=3.14.0"

[features]
test-hooks = []

[profile.release]
lto = true
strip = true
