name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate tag and installer
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test "$GITHUB_REF_NAME" = "v$package_version"
          sh -n install.sh
          sh -n tests/install_script.sh
          sh tests/install_script.sh

  build:
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            installer_asset: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            installer_asset: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            installer_asset: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            installer_asset: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            installer_asset: true
          - os: macos-14
            target: aarch64-apple-darwin
            installer_asset: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Generate documentation assets
        shell: bash
        run: |
          cargo run --quiet -- completions bash > git-repo-worktree.bash
          cargo run --quiet -- completions zsh > _git-repo-worktree
          cargo run --quiet -- completions fish > git-repo-worktree.fish
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          package="git-repo-worktree-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/git-repo-worktree" "$package/"
          cp LICENSE README.md skill/SKILL.md "$package/"
          cp git-repo-worktree.bash _git-repo-worktree git-repo-worktree.fish "$package/"
          manpage="$(find target -path '*/out/man/git-repo-worktree.1' -print -quit)"
          cp "$manpage" "$package/"
          tar -czf "$package.tar.gz" "$package"
          "target/${{ matrix.target }}/release/git-repo-worktree" version
      - name: Smoke-test installer asset
        if: matrix.installer_asset
        shell: bash
        run: |
          asset="git-repo-worktree-${{ matrix.target }}.tar.gz"
          release_dir="$RUNNER_TEMP/installer-release"
          smoke_home="$RUNNER_TEMP/installer-home"
          mkdir "$release_dir" "$smoke_home"
          cp "$asset" "$release_dir/"
          if command -v sha256sum >/dev/null 2>&1; then
            checksum="$(sha256sum "$release_dir/$asset")"
          else
            checksum="$(shasum -a 256 "$release_dir/$asset")"
          fi
          printf '%s  %s\n' "${checksum%% *}" "$asset" > "$release_dir/SHA256SUMS"
          HOME="$smoke_home" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_REPO_WORKTREE_RELEASE_BASE="file://$release_dir" \
            sh install.sh \
              --version "$GITHUB_REF_NAME" \
              --install-dir "$smoke_home/bin" \
              --no-git-alias
          "$smoke_home/bin/git-repo-worktree" version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-repo-worktree-${{ matrix.target }}
          path: git-repo-worktree-${{ matrix.target }}.tar.gz
          if-no-files-found: error
      - name: Attest archive provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: git-repo-worktree-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: git-repo-worktree-*
          merge-multiple: true
      - name: Create checksum manifest
        shell: bash
        run: |
          archive_count="$(find . -maxdepth 1 -name 'git-repo-worktree-*.tar.gz' | wc -l)"
          test "$archive_count" -eq 6
          sha256sum install.sh git-repo-worktree-*.tar.gz > SHA256SUMS
      - name: Attest installer and checksum manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            install.sh
            SHA256SUMS
      - name: Publish immutable release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "release $tag is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
          gh release upload "$tag" \
            install.sh \
            SHA256SUMS \
            git-repo-worktree-*.tar.gz \
            --clobber
          gh release edit "$tag" --draft=false --latest
