name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test installer
        run: |
          sh -n install.sh
          sh -n tests/install_script.sh
          sh tests/install_script.sh
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install repo
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git clone -q https://gerrit.googlesource.com/git-repo "$RUNNER_TEMP/git-repo"
          echo "GRW_TEST_REPO_URL=$RUNNER_TEMP/git-repo" >> "$GITHUB_ENV"
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Install fuse-overlayfs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse-overlayfs fuse3
          echo "GRW_TEST_REQUIRE_OVERLAY=1" >> "$GITHUB_ENV"
      - name: Validate embedded skill
        shell: bash
        run: |
          test "$(wc -l < skill/SKILL.md)" -le 500
          grep -q '^name: git-repo-worktree$' skill/SKILL.md
          grep -q '^description: ' skill/SKILL.md
          ! grep -q '^x-installed-' skill/SKILL.md
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features --no-fail-fast

  musl-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/release/git-repo-worktree version
      - name: Check the crates.io package builds
        run: cargo package --locked

  shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck install.sh tests/install_script.sh

  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --locked
